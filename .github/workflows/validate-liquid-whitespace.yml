name: Validate Liquid whitespace cleanup

on:
  push:
    paths:
      - '.github/workflows/validate-liquid-whitespace.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trim-liquid-whitespace-20260806
          fetch-depth: 0

      - name: Verify exact tested layout and limited diff
        run: |
          test "$(git hash-object _layouts/default.html)" = "c8182f6ac0081ad7259dce10256d36ed133e3b9d"
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD | sort)
          expected=$(printf '%s\n' '.github/workflows/validate-liquid-whitespace.yml' '_layouts/default.html' | sort)
          test "$changed" = "$expected"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build current production baseline
        run: |
          git clone --depth 1 --branch main https://github.com/olmogaldaz/olmogaldaz.github.io.git /tmp/site-source-before
          jekyll build --trace --source /tmp/site-source-before --destination /tmp/site-before

      - name: Build cleaned branch
        run: jekyll build --trace --destination /tmp/site-after

      - name: Compare all generated pages
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'json'

          def generated_path(root, url)
            return File.join(root, 'index.html') if url == '/'
            File.join(root, url.sub(%r{\A/}, ''), 'index.html')
          end

          def json_ld(text, path)
            match = text.match(%r{<script type="application/ld\+json">\s*(\{.*?\})\s*</script>}m)
            raise "JSON-LD missing in #{path}" unless match
            JSON.parse(match[1])
          end

          before_resources = YAML.unsafe_load_file('/tmp/site-source-before/_data/resources.yml').fetch('html')
          after_resources = YAML.unsafe_load_file('_data/resources.yml').fetch('html')
          raise 'Resource catalogs differ' unless before_resources == after_resources
          raise "Expected 56 pages, found #{after_resources.length}" unless after_resources.length == 56

          blank_before_total = 0
          blank_after_total = 0
          reductions = {}

          after_resources.each do |resource|
            url = resource.fetch('url')
            before_path = generated_path('/tmp/site-before', url)
            after_path = generated_path('/tmp/site-after', url)
            before = File.read(before_path, encoding: 'UTF-8')
            after = File.read(after_path, encoding: 'UTF-8')

            before_nonblank = before.lines.reject { |line| line.strip.empty? }.map(&:rstrip)
            after_nonblank = after.lines.reject { |line| line.strip.empty? }.map(&:rstrip)
            raise "Non-empty HTML changed for #{url}" unless before_nonblank == after_nonblank
            raise "JSON-LD semantics changed for #{url}" unless json_ld(before, before_path) == json_ld(after, after_path)

            before_blank = before.lines.count { |line| line.strip.empty? }
            after_blank = after.lines.count { |line| line.strip.empty? }
            raise "Blank lines increased for #{url}" if after_blank > before_blank

            blank_before_total += before_blank
            blank_after_total += after_blank
            reductions[url] = before_blank - after_blank
          end

          raise 'The cleanup did not reduce blank lines' unless blank_after_total < blank_before_total
          puts "Validated #{after_resources.length} pages."
          puts "Blank lines: #{blank_before_total} -> #{blank_after_total} (removed #{blank_before_total - blank_after_total})."
          puts "Per-page reduction range: #{reductions.values.min}..#{reductions.values.max}."
          RUBY

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/validate-liquid-whitespace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-liquid-whitespace.yml
          git commit -m 'Remove temporary whitespace validation'
          git push origin HEAD:trim-liquid-whitespace-20260806
